name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install development tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
        
      - name: Install voAAC
        run: sudo apt-get install libvo-aacenc-dev
        
      - name: Install autopoint for zbar
        run: sudo apt-get update && sudo apt-get install -y autopoint
        
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext autoconf automake libtool

      - name: Install build-wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0

      - name: Build ipc_camera
        run: |
          set -e
          source setup.sh
          cd third
          ./jmake_git_all.sh
          cd -
          cd tools
          ./prepare_jmake_dirs.sh
          cd -
          cd chip/rts3917/sdk/rts39xx_sdk_v5.3/
          printf '3\n\n' | ./launch.sh
          cd -
          cd chip/rts3917/sdk/rts39xx_sdk_v5.3/out/rts3917n_base/
          make secure_boot M=1
          make
          cd ../../../../fw/
          STATIC_ANALYSIS_ONLY=1 \
          build-wrapper-linux-x86-64 \
            --out-dir "${GITHUB_WORKSPACE}/bw-output" \
            jmake --rebuild
          test -s "${GITHUB_WORKSPACE}/bw-output/compile_commands.json"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.compile-commands=${{ github.workspace }}/bw-output/compile_commands.json
            -Dsonar.sources=cam,chip/rts3917/platform,chip/rts3917/fw
            -Dsonar.exclusions=**/build/**,**/out/**,chip/rts3917/fw/staging/**,chip/rts3917/fw/rootfs/**,third/**
            -Dsonar.sourceEncoding=UTF-8
